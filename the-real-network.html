<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Real Network</title>
<style>
:root{--bg:#09111e;--bg2:#111a28;--card:rgba(24,35,55,.74);--line:#3a4f6b;--text:#f8f2e8;--muted:#b9c7da;--accent:#f3c969;--accent2:#7dd3fc;--good:#38d39f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;font:13px/1.55 "Space Grotesk",system-ui,sans-serif;color:var(--text);background:var(--bg)}
a{color:var(--accent2);text-decoration:none} button,input,textarea,select{font:inherit}
body{background:linear-gradient(145deg,#172031 0%,#0b1322 55%,#09111f 100%)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(5,9,16,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#ff2d6f,#6ee7ff);color:#000;font-weight:900}
.brand-text{font-family:"Playfair Display",serif;font-weight:700;font-size:1.3rem;letter-spacing:.4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;cursor:pointer}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--line);border-radius:99px}
.avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:linear-gradient(135deg,#273453,#0d131d);color:#fff;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.layout{display:grid;grid-template-columns:280px 1fr 300px;gap:16px;padding:16px;max-width:1320px;margin:0 auto}
@media (max-width:1100px){.layout{grid-template-columns:1fr}.left,.rightcol{order:2}}
@media (max-width:720px){.layout{padding:10px}.tabs button{padding:5px 9px;font-size:11px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(8px)}
.profile{position:sticky;top:70px}
.feed-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.compose textarea{width:100%;min-height:92px;resize:vertical;background:#08111d;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}
.compose button,.button{background:var(--accent);color:#fff;border:none;border-radius:99px;padding:8px 14px;cursor:pointer}
button.small{font-size:11px;padding:5px 10px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
button.danger{background:#ef4444}
.post{margin:12px 0;border-top:1px solid var(--line);padding-top:12px}
.post:first-child{margin-top:0;border-top:none}
.post-head{display:flex;align-items:center;gap:10px}
.handle{color:var(--muted);font-size:11px}
.post-text{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.post-image{width:100%;border-radius:12px;margin-bottom:8px;max-height:440px;object-fit:cover}
.actions{display:flex;gap:8px;align-items:center}
.stats-line{color:var(--muted);font-size:11px}
.comments{margin-top:10px;padding-left:10px;border-left:2px solid var(--line)}
.comment{margin:8px 0;padding:8px;background:#091222;border-radius:10px}
.search{width:100%;padding:8px 10px;border-radius:99px;background:#08111d;border:1px solid var(--line);color:var(--text)}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.6);z-index:10}
.modal.show{display:grid}
.modal-body{width:min(420px,92vw);background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px}
.modal h2{margin-bottom:10px}
.field{margin:8px 0}
.field label{display:block;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;border-radius:8px;background:#08111d;border:1px solid var(--line);color:var(--text)}
.toast{position:fixed;bottom:18px;right:18px;padding:10px 14px;background:#142033;border:1px solid var(--line);border-radius:10px;display:none;max-width:320px}
.toast.show{display:block}
.notice{background:#121f31;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.empty{color:var(--muted);padding:18px;text-align:center}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;background:#0d182a;color:var(--muted);border:1px solid var(--line)}
 evening? no
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"></head>
<body>
<div class="topbar">
  <div class="brand"><div class="brand-mark">TRN</div><div class="brand-text">The Real Network</div></div>
  <div class="tabs">
    <button data-view="feed" class="active">Home</button>
    <button data-view="explore">Esplora</button>
    <button data-view="profile">Profilo</button>
    <button data-view="messages">Messaggi</button>
    <button data-view="notifications">Notifiche</button>
  </div>
  <div class="right">
    <div id="session"></div>
  </div>
</div>
<div class="layout">
  <aside class="left"><div class="card profile" id="profileCard"></div></aside>
  <main><section class="card" id="viewFeed"><div class="feed-head"><h2>Feed</h2><button class="button small" id="newPostBtn">Nuovo post</button></div><div class="compose" id="composer" style="display:none"><textarea id="postText" placeholder="Condividi qualcosa con la rete..."></textarea><div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><input type="url" id="postImage" placeholder="URL immagine (facoltativo)" style="flex:1;min-width:180px;padding:8px;border-radius:99px;background:#08111d;border:1px solid var(--line);color:var(--text)"><button class="button small" id="publishPost">Pubblica</button><button class="ghost small" id="cancelPost">Annulla</button></div></div><div id="feedList"></div></section><section id="viewExplore" style="display:none" class="card"><h2>Esplora Persone</h2><input class="search" id="searchInput" placeholder="Cerca per nome o handle..." style="margin:10px 0"><div id="exploreList"></div></section><section id="viewProfile" style="display:none" class="card"><div id="profileView"></div></section><section id="viewMessages" style="display:none" class="card"><h2>Messaggi</h2><div class="layout" style="grid-template-columns:240px 1fr;padding:0;max-width:none"><div id="convList" class="card"></div><div id="convThread" class="card"></div></div></section><section id="viewNotifications" style="display:none" class="card"><h2>Notifiche</h2><div id="notifList"></div></section></main>
  <aside class="rightcol"><div class="card" id="trendingCard"></div></aside>
</div>
<div id="modal" class="modal"><div class="modal-body" id="modalBody"></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY='trn:data:v3', SESSION='trn:session:v3';
function uid(prefix='x'){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function loadState(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function saveState(s){ localStorage.setItem(KEY,JSON.stringify(s)); }
function loadSession(){ return JSON.parse(localStorage.getItem(SESSION)||'null'); }
function saveSession(s){ if(s) localStorage.setItem(SESSION,JSON.stringify(s)); else localStorage.removeItem(SESSION); }
let S=loadState();
if(!S){ S={users:[],posts:[],comments:[],messages:[],notifications:[]}; seedDemo(); saveState(S); }
function seedDemo(){
  const demo=[['indigouser','IndigoUser','Articoli, note e analisi su Prato e distretto tessile.'],['pratoinforma','Prato Informa','Agenda economica, imprese e lavoro del distretto.'],['tessilelab','Tessile Lab','Tecnica, filati, tintura e innovazione tessile.'],['supplychain','Supply Chain','Logistica, materiali e processi.']];
  demo.forEach(([handle,name,bio],i)=>{
    const u={id:'u'+(i+1),handle,name,bio,avatar:'',color:['#ff2d6f','#6ee7ff','#38d39f','#ffb347'][i%4],password:null,createdAt:Date.now()-86400000*(4-i),following:[],followers:[]};
    S.users.push(u);
  });
  const posts=[
 "Prato riparte dalla supply chain: il distretto tessile taglia i tempi di delivery del 18% con una piattaforma condivisa.",
 "Nuova linea per filati riciclati a Montemurlo: 1.200 tonnellate annuali in arrivo entro il 2026.",
 "Il municipio estende gli incentivi per digitalizzare PMI tessili: voucher fino a 25.000 euro per ERP e tracciabilità.",
 "Accordo tra consorzio lanifici e università: laboratorio 4.0 per testare nuovi blend lana-sintetico.",
 "Prato export +7% nel primo trimestre. Crescono audens e buyers europei su campioni sostenibili.",
 "Mercato tessile rigenerato: costi della materia prima riciclata scendono sotto il 15% del virgin market.",
 "Nuovo hub logistico a Calenzano: cross-docking per filati e tessuti con tempi di throughput ridotti a 48 ore.",
 "Digitale in fabbrica: MES e sensori su telai hanno ridotto le fermate non pianificate del 32%.",
 "Startup pratese lancia software per tracciabilità della filiera: da fibra a prodotto finito in blockchain privata.",
 "Fotovoltaico industriale: 14 capannoni in solare, cash flow positivo dopo 3 anni.",
 "Formazione tecnica: 200 giovani in apprendistato tessile quest'anno, con docenti in fabbrica.",
 "Pronto moda pratese all'estero: ordini B2B da Germania e Nord Europa in crescita del 21%.",
 "Tintoria riduce consumo acqua del 40% con impianti closed-loop a recupero in stabilimento.",
 "Nova business: servizio di certificazione anagrafiche materiali per brand luxury e fast fashion.",
 "Prato Fashion Week locale: 80 stand di tessuti innovativi, focus su riciclo e upcycling.",
 "Costo energia: consorzio imprese contratta fornitura green a lungo termine scontato 12%.",
 "Reti di impresa per export: 15 PMI con dividono agenti e packaging per abbattere i costi.",
 "Politici locali annunciano piano 2026 per incubatore tessile e laboratorio test materiali.",
 "Dati economici: occupazione manifatturiera Prato +3,1% su base annua, 1.700 nuovi posti.",
 "Economia circolare e tessile: eccellenza pratese riconosciuta a Bruxelles per il progetto distretto verde."
  ];
  const authors=['u1'];
  posts.forEach((text,i)=>{ addPostSeed(authors[i % authors.length], text, null); });

}
function addPostSeed(authorId,text,image){ const p={id:uid('p'),authorId,text,image:image||null,createdAt:Date.now()-Math.random()*86400000,likes:[],commentIds:[]}; S.posts.push(p); return p.id; }
function addCommentSeed(authorId,postId,text){ const c={id:uid('c'),postId,authorId,text,createdAt:Date.now()-Math.random()*86400000}; S.comments.push(c); const p=S.posts.find(x=>x.id===postId); if(p) p.commentIds.push(c.id); return c.id; }
function currentUser(){ const sess=loadSession(); return sess ? S.users.find(u=>u.id===sess.userId) : null; }
function view(viewName){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===viewName)); ['Feed','Explore','Profile','Messages','Notifications'].forEach(v=>{const el=document.getElementById('view'+v); if(el) el.style.display=(v.toLowerCase()===viewName)?'block':'none';}); renderAll(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function onReaderLoad(){ }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('it-IT', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(u){ return (u.name||u.handle).split(/\s/).map(x=>x?.[0]||'').join('').slice(0,2).toUpperCase(); }
function avatarHtml(u,size=38){ if(u.avatar){ return `<div class="avatar" style="width:${size}px;height:${size}px"><img src="${escapeHtml(u.avatar)}" alt="${escapeHtml(u.name)}" onerror="this.style.display='none'"></div>`; } return `<div class="avatar" style="width:${size}px;height:${size}px;background:${escapeHtml(u.color)}">${escapeHtml(initials(u))}</div>`; }
function renderSession(){   const c=document.getElementById('session'); const u=currentUser(); if(u){ c.innerHTML=`<div class="user-chip">${avatarHtml(u,28)}<span>@${escapeHtml(u.handle)}</span><button class="ghost small" id="logoutBtn">Esci</button></div>`; document.getElementById('logoutBtn').onclick=logout; } else { c.innerHTML=`<button class="button small" id="createUserBtn">Crea nome utente</button>`; document.getElementById('createUserBtn').onclick=()=>showAuth('register'); } }
function showAuth(mode){
  const body=document.getElementById('modalBody');
  body.innerHTML=`<h2>Crea nome utente</h2>
  <div class="field"><label>Handle</label><input id="authHandle" placeholder="es. prato-user"></div>
  <div class="field"><label>Nome (opzionale)</label><input id="authName" placeholder="Nome Cognome"></div>
  <div class="field"><label>Bio (opzionale)</label><textarea id="authBio"></textarea></div>
  <div class="field"><label>Avatar URL (opzionale)</label><input id="authAvatar" type="url"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="ghost small" id="authCancel">Annulla</button><button class="button small" id="authSubmit">Crea</button></div>
  <p class="notice" style="margin-top:12px;font-size:11px">Il profilo è locale del browser. Nessuna password o server.</p>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('authCancel').onclick=closeModal;
  document.getElementById('authSubmit').onclick=()=>submitAuth(mode);
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function submitAuth(mode){
  const handle=(document.getElementById('authHandle').value||'').trim().toLowerCase().replace(/^@/,'');
  if(!/^[a-z0-9_.-]{3,24}$/.test(handle)) return toast('Handle non valido (3-24 caratteri, alfanumerico/_ . -).');
  const existing=S.users.find(x=>x.handle===handle);
  const name=(document.getElementById('authName').value||'').trim() || handle;
  const bio=(document.getElementById('authBio').value||'').trim();
  const avatar=(document.getElementById('authAvatar').value||'').trim();
  let u=existing;
  if(!u){ const colors=['#ff2d6f','#6ee7ff','#38d39f','#ffb347','#a78bfa','#f472b6']; u={id:uid('u'),handle,name,bio,avatar,color:colors[Math.floor(Math.random()*colors.length)],password:null,createdAt:Date.now(),following:[],followers:[]}; S.users.push(u); }
  else { u.name=name; u.bio=bio; if(avatar) u.avatar=avatar; }
  saveState(S); saveSession({userId:u.id});
  pNotification(u.id,'welcome','u1',null,'Benvenuto su The Real Network. Esplora i 20 articoli su economia e tessile di Prato e crea il tuo profilo.');
  toast('Profilo pronto, @'+u.handle); closeModal(); renderAll();
}
function logout(){ saveSession(null); view('feed'); toast('Logout effettuato.'); }
function pNotification(userId,type,actorId,refId,text){ const n={id:uid('n'),userId,type,actorId,refId,text,read:false,createdAt:Date.now()}; S.notifications.push(n); saveState(S); }
function unreadCount(u){ if(!u) return 0; return S.notifications.filter(n=>n.userId===u.id && !n.read).length; }
function addPost(){
  const u=currentUser(); if(!u) return showAuth('login');
  const text=(document.getElementById('postText').value||'').trim();
  const image=(document.getElementById('postImage').value||'').trim();
  if(!text && !image) return toast('Scrivi qualcosa o aggiungi un\'immagine.');
  const p={id:uid('p'),authorId:u.id,text,image:image||null,createdAt:Date.now(),likes:[],commentIds:[]}; S.posts.unshift(p); saveState(S);
  document.getElementById('postText').value=''; document.getElementById('postImage').value='';
  document.getElementById('composer').style.display='none';
  toast('Post pubblicato.'); renderAll();
}
function toggleLike(postId){
  const u=currentUser(); if(!u) return showAuth('login');
  const p=S.posts.find(x=>x.id===postId); if(!p) return;
  if(p.likes.includes(u.id)){ p.likes=p.likes.filter(x=>x!==u.id); }
  else { p.likes.push(u.id); if(p.authorId!==u.id) pNotification(p.authorId,'like',u.id,postId,`${u.name} ha messo like al tuo post.`); }
  saveState(S); renderAll();
}
function addComment(postId){
  const u=currentUser(); if(!u) return showAuth('login');
  const area=document.getElementById('commentInput-'+postId); const text=(area?.value||'').trim(); if(!text) return;
  const c={id:uid('c'),postId,authorId:u.id,text,createdAt:Date.now()}; S.comments.push(c); const p=S.posts.find(x=>x.id===postId); if(p) p.commentIds.push(c.id);
  if(p && p.authorId!==u.id) pNotification(p.authorId,'comment',u.id,postId,`${u.name} ha commentato il tuo post.`);
  saveState(S); renderAll();
}
function toggleFollow(userId){
  const u=currentUser(); if(!u) return showAuth('login'); if(userId===u.id) return;
  if(!u.following.includes(userId)){ u.following.push(userId); const target=S.users.find(x=>x.id===userId); if(target && !target.followers.includes(u.id)) target.followers.push(u.id); pNotification(userId,'follow',u.id,null,`${u.name} ha iniziato a seguirti.`); toast('Ora segui @'+target.handle); }
  else { u.following=u.following.filter(x=>x!==userId); const target=S.users.find(x=>x.id===userId); if(target) target.followers=target.followers.filter(x=>x!==u.id); toast('Hai smesso di seguire.'); }
  saveState(S); renderAll();
}
function timeAgo(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60)return 'ora'; if(s<3600)return Math.floor(s/60)+' min'; if(s<86400)return Math.floor(s/3600)+' h'; return Math.floor(s/86400)+' g'; }
let selectedProfileId=null;
let selectedConversation=null;
function renderAll(){ renderSession(); renderProfileCard(); renderFeed(); renderExplore(); renderProfileView(); renderMessages(); renderNotifications(); renderTrending(); }
function renderProfileCard(){
  const el=document.getElementById('profileCard'); const u=currentUser();
  if(!u){ el.innerHTML='<h3>Crea nome utente</h3><p class="empty">Crea un profilo locale e inizia a pubblicare.</p><button class="button" onclick="showAuth(\'register\')" style="width:100%;margin-top:8px">Crea nome utente</button>'; return; }
  el.innerHTML=`<div style="display:flex;gap:12px;align-items:center">${avatarHtml(u,52)}<div><strong>${escapeHtml(u.name)}</strong><div class="handle">@${escapeHtml(u.handle)}</div></div></div>
  <p style="margin:10px 0">${escapeHtml(u.bio||'Profilo nuovo su The Real Network.')}</p>
  <div class="stats-line">Seguiti ${u.following.length} • Follower ${u.followers.length} • Post ${S.posts.filter(p=>p.authorId===u.id).length}</div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="ghost small" onclick="view('profile');selectedProfileId='${u.id}'">Vedi profilo</button>
    <button class="ghost small" onclick="editProfile()">Modifica profilo</button>
  </div>`;
}
function editProfile(){
  const u=currentUser(); if(!u)return;
  const body=document.getElementById('modalBody');
  body.innerHTML=`<h2>Modifica profilo</h2>
  <div class="field"><label>Nome</label><input id="epName" value="${escapeHtml(u.name)}"></div>
  <div class="field"><label>Bio</label><textarea id="epBio">${escapeHtml(u.bio||'')}</textarea></div>
  <div class="field"><label>Avatar URL</label><input id="epAvatar" value="${escapeHtml(u.avatar||'')}"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="ghost small" onclick="closeModal()">Annulla</button><button class="button small" id="epSave">Salva</button></div>`;
  document.getElementById('modal').classList.add('show');
  document.getElementById('epSave').onclick=()=>{ u.name=document.getElementById('epName').value.trim()||u.name; u.bio=document.getElementById('epBio').value.trim(); u.avatar=document.getElementById('epAvatar').value.trim(); saveState(S); toast('Profilo aggiornato.'); closeModal(); renderAll(); };
}
function postHtml(p){
  const a=S.users.find(x=>x.id===p.authorId)||{handle:'?','name':'?','color':'#666'};
  const liked=currentUser()?.likes?.includes? false:false; const isLiked=p.likes.includes(currentUser()?.id);
  const comments=S.comments.filter(c=>c.postId===p.id);
  const commentHtml=comments.map(c=>{
    const ca=S.users.find(x=>x.id===c.authorId)||{handle:'?',name:'?',color:'#666'};
    return `<div class="comment">${avatarHtml(ca,22)} <b>${escapeHtml(ca.name)}</b> <span class="handle">@${escapeHtml(ca.handle)} • ${timeAgo(c.createdAt)}</span><div class="post-text" style="margin:4px 0">${escapeHtml(c.text)}</div></div>`;
  }).join('');
  const followBtn = currentUser() && currentUser().id!==p.authorId ? (currentUser().following.includes(p.authorId) ? `<button class="ghost small" onclick="toggleFollow('${p.authorId}')">Seguito</button>` : `<button class="ghost small" onclick="toggleFollow('${p.authorId}')">Segui</button>`) : '';
  return `<div class="post" data-post-id="${p.id}">
    <div class="post-head">${avatarHtml(a,40)}<div><strong>${escapeHtml(a.name)}</strong> <span class="handle">@${escapeHtml(a.handle)}</span><div class="handle">${timeAgo(p.createdAt)}</div></div>${followBtn}</div>
    ${p.text?`<div class="post-text">${escapeHtml(p.text)}</div>`:''}
    ${p.image?`<img class="post-image" src="${escapeHtml(p.image)}" alt="immagine post" onerror="this.style.display='none'">`:''}
    <div class="actions">
      <button class="ghost small" onclick="toggleLike('${p.id}')">${isLiked?'❤️':'🤍'} ${p.likes.length}</button>
      <button class="ghost small" onclick="focusComments('${p.id}')">💬 ${comments.length}</button>
      ${currentUser()&&currentUser().id===p.authorId?`<button class="ghost small danger" onclick="deletePost('${p.id}')">Elimina</button>`:''}
    </div>
    <div id="comments-${p.id}" style="display:none" class="comments">
      ${commentHtml}
      ${currentUser()?`<div style="display:flex;gap:8px;margin-top:8px"><input id="commentInput-${p.id}" placeholder="Commenta..." style="flex:1;padding:8px;border-radius:99px;background:#08111d;border:1px solid var(--line);color:var(--text)"><button class="ghost small" onclick="addComment('${p.id}')">Invia</button></div>`:''}
    </div>
  </div>`;
}
function focusComments(postId){ const el=document.getElementById('comments-'+postId); if(!el) return; el.style.display=el.style.display==='none'?'block':'none'; }
function deletePost(postId){ const p=S.posts.find(x=>x.id===postId); if(!p) return; if(!currentUser()||currentUser().id!==p.authorId) return; S.posts=S.posts.filter(x=>x.id!==postId); S.comments=S.comments.filter(c=>c.postId!==postId); S.messages=S.messages; saveState(S); toast('Post eliminato.'); renderAll(); }
function renderFeed(){
  const list=document.getElementById('feedList'); const composer=document.getElementById('composer');
  const newBtn=document.getElementById('newPostBtn');
  if(currentUser()){ newBtn.style.display=''; composer.style.display=composer.style.display; newBtn.onclick=()=>{ composer.style.display=composer.style.display==='none'?'block':'none'; }; }
  else { newBtn.style.display='none'; composer.style.display='none'; }
  document.getElementById('publishPost').onclick=addPost; document.getElementById('cancelPost').onclick=()=>{ composer.style.display='none'; };
  const u=currentUser(); let posts=[];
  if(u && u.following.length){ const ids=[u.id,...u.following]; posts=S.posts.filter(p=>ids.includes(p.authorId)); } else { posts=[...S.posts]; }
  if(!posts.length) posts=[...S.posts].slice(0,20);
  posts.sort((a,b)=>b.createdAt-a.createdAt);
  list.innerHTML=posts.length ? posts.map(postHtml).join('') : '<div class="empty">Nessun post. Hai visto la visione del futuro.</div>';
}
function renderExplore(){
  const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  const u=currentUser();
  let users=[...S.users].filter(x=>!u||x.id!==u.id);
  if(q) users=users.filter(x=>x.name.toLowerCase().includes(q)||x.handle.toLowerCase().includes(q)|| (x.bio||'').toLowerCase().includes(q));
  const rec=document.getElementById('exploreList');
  if(!users.length){ rec.innerHTML='<div class="empty">Nessun utente trovato.</div>'; return; }
  rec.innerHTML=users.map(x=>{
    const rel = u && u.following.includes(x.id) ? 'Seguito' : (u?'Segui':'');
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">${avatarHtml(x,40)}<div style="flex:1"><strong>${escapeHtml(x.name)}</strong><div class="handle">@${escapeHtml(x.handle)}</div><div class="stats-line">${escapeHtml(x.bio||'Profilo in costruzione')}</div><div class="stats-line">Seguiti ${x.following.length} • Follower ${x.followers.length}</div></div><div style="display:flex;gap:6px">${u?`<button class="${u.following.includes(x.id)?'ghost':'button'} small" onclick="toggleFollow('${x.id}')">${u.following.includes(x.id)?'Seguito':'Segui'}</button>`:'<button class="button small" onclick="showAuth(\'register\')">Crea nome utente</button>'}<button class="ghost small" onclick="viewProfile('${x.id}')">Profilo</button></div></div>`;
  }).join('');
  document.getElementById('searchInput').oninput=()=>renderExplore();
}
function viewProfile(userId){ selectedProfileId=userId; view('profile'); }
function renderProfileView(){
  const el=document.getElementById('profileView'); if(!selectedProfileId){ const u=currentUser(); if(u) selectedProfileId=u.id; else { el.innerHTML='<div class="empty">Accedi per vedere un profilo.</div>'; return; } }
  const p=S.users.find(x=>x.id===selectedProfileId); if(!p){ el.innerHTML='<div class="empty">Profilo non trovato.</div>'; return; }
  const u=currentUser();
  const isMe=u && u.id===p.id; const isFollowing=u && u.following.includes(p.id);
  const posts=S.posts.filter(x=>x.authorId===p.id).sort((a,b)=>b.createdAt-a.createdAt);
  el.innerHTML=`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${avatarHtml(p,72)}<div style="flex:1"><h2>${escapeHtml(p.name)}</h2><div class="handle">@${escapeHtml(p.handle)}${isMe?' • Tu':''}</div><p style="margin:8px 0">${escapeHtml(p.bio||'Profilo su The Real Network.')}</p><div class="stats-line">Seguiti ${p.following.length} • Seguaci ${p.followers.length} • Post ${posts.length}</div>
  ${u&&!isMe?`<div style="margin-top:10px;display:flex;gap:8px"><button class="${isFollowing?'ghost':'button'} small" onclick="toggleFollow('${p.id}')">${isFollowing?'Seguito':'Segui'}</button><button class="ghost small" onclick="startMessage('${p.id}')">Messaggio</button></div>`:''}
  ${isMe?`<button class="ghost small" onclick="editProfile()" style="margin-top:10px">Modifica profilo</button>`:''}</div></div>
  <div class="post" style="border-top:1px solid var(--line);margin-top:14px"><h3>Post di @${escapeHtml(p.handle)}</h3></div>
  ${posts.length?posts.map(postHtml).join(''):'<div class="empty">Nessun post.</div>'}`;
}
function startMessage(userId){ selectedConversation=userId; view('messages'); }
function renderMessages(){
  const u=currentUser(); const list=document.getElementById('convList'); const thread=document.getElementById('convThread');
  if(!u){ list.innerHTML='<div class="empty">Accedi.</div>'; thread.innerHTML=''; return; }
  const ids=new Set();
  S.messages.forEach(m=>{ if(m.from===u.id||m.to===u.id) { ids.add(m.from===u.id?m.to:m.from);} });
  ids.add(...u.following);
  const convs=[...ids].map(id=>S.users.find(x=>x.id===id)).filter(Boolean);
  list.innerHTML=`<h3 style="margin-bottom:8px">Conversazioni</h3>${convs.length?convs.map(x=>`<div style="padding:8px;border-radius:8px;cursor:pointer;background:${selectedConversation===x.id?'#142033':'transparent'}" onclick="selectedConversation='${x.id}';renderMessages()">${avatarHtml(x,26)} ${escapeHtml(x.name)} <span class="handle">@${escapeHtml(x.handle)}</span></div>`).join(''):'<div class="empty">Nessuna conversazione.</div>'}`;
  const target=S.users.find(x=>x.id===selectedConversation);
  if(!target){ thread.innerHTML='<div class="empty">Seleziona una conversazione.</div>'; return; }
  const msgs=S.messages.filter(m=>((m.from===u.id&&m.to===target.id)||(m.from===target.id&&m.to===u.id))).sort((a,b)=>a.createdAt-b.createdAt);
  msgs.filter(m=>m.to===u.id&&!m.read).forEach(m=>m.read=true); saveState(S);
  const html=msgs.map(m=>`<div style="max-width:72%;margin:6px 0;padding:8px 10px;border-radius:12px;${m.from===u.id?'margin-left:auto;background:var(--accent);color:#fff':'background:#11192a'}">${escapeHtml(m.text)}<div style="font-size:9px;opacity:.7;margin-top:4px">${timeAgo(m.createdAt)}</div></div>`).join('');
  thread.innerHTML=`<h3>${escapeHtml(target.name)}</h3><div style="height:360px;overflow:auto;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px">${html||'<div class="empty">Inizia la conversazione.</div>'}</div>
  <div style="display:flex;gap:8px"><input id="msgInput" style="flex:1;padding:8px;border-radius:99px;background:#08111d;border:1px solid var(--line);color:var(--text)" placeholder="Scrivi un messaggio..."><button class="button small" onclick="sendMessage('${target.id}')">Invia</button></div>`;
  const input=document.getElementById('msgInput'); if(input) input.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(target.id); }});
}
function sendMessage(toId){
  const u=currentUser(); if(!u) return showAuth('login');
  const input=document.getElementById('msgInput'); const text=(input?.value||'').trim(); if(!text) return;
  S.messages.push({id:uid('m'),from:u.id,to:toId,text,createdAt:Date.now(),read:false}); saveState(S); if(input) input.value=''; renderMessages(); toast('Messaggio inviato.');
}
function renderNotifications(){
  const u=currentUser(); const el=document.getElementById('notifList');
  if(!u){ el.innerHTML='<div class="empty">Accedi.</div>'; return; }
  const ns=S.notifications.filter(n=>n.userId===u.id).sort((a,b)=>b.createdAt-a.createdAt);
  if(!ns.length){ el.innerHTML='<div class="empty">Nessuna notifica.</div>'; return; }
  el.innerHTML=ns.map(n=>{
    const a=S.users.find(x=>x.id===n.actorId)||{name:'Sistema',color:'#666'};
    return `<div style="padding:10px;border-bottom:1px solid var(--line);opacity:${n.read?0.65:1};cursor:pointer" onclick="markRead('${n.id}')"><strong>${escapeHtml(a.name)}</strong> <span class="stats-line">${timeAgo(n.createdAt)}</span><div>${escapeHtml(n.text)}</div></div>`;
  }).join('');
  const unread=unreadCount(u); document.querySelector('[data-view="notifications"]').textContent=`Notifiche${unread?` (${unread})`:''}`;
}
function markRead(id){ const n=S.notifications.find(x=>x.id===id); if(n){ n.read=true; saveState(S); renderAll(); } }
function renderTrending(){
  const el=document.getElementById('trendingCard');
  const top=[...S.users].sort((a,b)=>b.followers.length-a.followers.length).slice(0,5);
  el.innerHTML=`<h3>Chi seguire</h3>${top.map(x=>`<div style="display:flex;align-items:center;gap:8px;margin:8px 0">${avatarHtml(x,28)}<div style="flex:1"><strong>${escapeHtml(x.name)}</strong><div class="handle">@${escapeHtml(x.handle)}</div></div>${currentUser()&&currentUser().id!==x.id?`<button class="ghost small" onclick="toggleFollow('${x.id}')">${currentUser().following.includes(x.id)?'Seguito':'Segui'}</button>`:''}</div>`).join('')}` || '<div class="empty">Nessun utente.</div>';
  el.innerHTML+=`<h3 style="margin-top:12px">Suggerimenti</h3><p class="stats-line">Invita persone condividendo URL della pagina. Tutti i dati restano nel browser locale.</p>`;
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>view(b.dataset.view)));
const title=document.getElementById('modal'); title.addEventListener('click',e=>{ if(e.target===title && currentUser()) closeModal(); });
try { view('feed'); } catch(e){ console.error(e); }
if(!currentUser()) setTimeout(()=>showAuth('register'), 120);
</script>
</body>
</html>
