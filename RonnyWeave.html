<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RonnyWeave — 3D Weave Designer</title>
  <style>
    /* ── Design tokens (same as site) ── */
    :root {
      --bg: #0b0d0c;
      --surface: #121514;
      --surface-2: #1a1e1c;
      --ink: #f2f0e9;
      --muted: #a8b0a9;
      --accent: #ff2d6f;
      --accent-2: #c7a45b;
      --accent-ink: #1a0005;
      --line: rgba(232, 230, 220, 0.12);
      --line-strong: rgba(232, 230, 220, 0.24);
      --radius: 12px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    /* ── Layout ── */
    .rw-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      height: 100%;
      overflow: hidden;
    }

    /* ── 3D Canvas ── */
    .rw-canvas-wrap {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      border-right: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #rw-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--bg);
      cursor: grab;
    }

    #rw-canvas:active { cursor: grabbing; }

    /* ── Controls ── */
    .rw-controls {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      padding: 1.1rem 1rem;
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      min-width: 0;
    }

    .rw-controls::-webkit-scrollbar { width: 4px; }
    .rw-controls::-webkit-scrollbar-track { background: transparent; }
    .rw-controls::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

    .rw-controls h2 {
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .rw-controls h2:first-child { margin-top: 0; }

    .rw-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .rw-group label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
    }

    .rw-select,
    .rw-range {
      font: inherit;
      color: var(--ink);
      background: var(--surface-2);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      width: 100%;
    }

    .rw-range {
      accent-color: var(--accent);
      height: 6px;
    }

    .rw-color-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .rw-color-row input[type="color"] {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      flex-shrink: 0;
    }

    .rw-color-row input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .rw-color-row input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--line-strong);
      border-radius: 6px;
    }

    /* ── Presets ── */
    .rw-presets {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .rw-presets button {
      font: inherit;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .rw-presets button:hover { border-color: var(--accent); color: var(--ink); }
    .rw-presets button.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    /* ── Action row ── */
    .rw-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }

    .rw-actions button {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
    }

    .rw-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .rw-actions button.reset {
      color: var(--muted);
      border-color: var(--line);
    }
    .rw-actions button.reset:hover { border-color: var(--line-strong); color: var(--ink); }

    /* ── Overlay close ── */
    .rw-close-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.6rem;
    }

    .rw-close-btn {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .rw-close-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255, 45, 111, 0.08);
    }

    /* ── Scrollbar (light) ── */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

    /* ── Responsive: stacked on narrow ── */
    @media (max-width: 820px) {
      .rw-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
        overflow: auto;
      }
      .rw-controls {
        border-left: none;
        border-top: 1px solid var(--line);
        max-height: 40vh;
      }
      #rw-canvas { height: 60vh; }
    }
  </style>
</head>
<body>

  <div class="rw-layout">
    <!-- 3D Canvas -->
    <div class="rw-canvas-wrap">
      <canvas id="rw-canvas"></canvas>
    </div>

    <!-- Controls -->
    <div class="rw-controls">
      <h2>Weave Designer</h2>

      <div class="rw-group">
        <label>Warp <span style="color:var(--accent)">●</span></label>
        <div class="rw-color-row">
          <input type="color" id="rw-warp-color" value="#b85a3a">
          <span class="rw-range" style="writing-mode:vertical-lr; padding:0; height:auto; min-width:3rem;">
            <!-- represented as label -->
          </span>
        </div>
      </div>

      <div class="rw-group">
        <label>Weft <span style="color:var(--accent)">●</span></label>
        <div class="rw-color-row">
          <input type="color" id="rw-weft-color" value="#e8cf8f">
        </div>
      </div>

      <div class="rw-group">
        <label>Tessitura</label>
        <div class="rw-presets">
          <button data-pattern="plain" class="is-active">Plain</button>
          <button data-pattern="twill">Twill</button>
          <button data-pattern="satin">Satin</button>
        </div>
      </div>

      <div class="rw-group">
        <label>Velocità</label>
        <input type="range" id="rw-speed" min="0" max="2" step="0.05" value="0.8" class="rw-range">
      </div>

      <div class="rw-group">
        <label>Fili</label>
        <div class="rw-color-row" style="gap:0.8rem;">
          <input type="range" id="rw-warp-count" min="4" max="16" step="1" value="8" class="rw-range" style="flex:1;">
          <span style="font-size:0.68rem;color:var(--muted);min-width:1.4rem;text-align:right;" id="rw-warp-count-label">8</span>
          <input type="range" id="rw-weft-count" min="4" max="16" step="1" value="8" class="rw-range" style="flex:1;">
          <span style="font-size:0.68rem;color:var(--muted);min-width:1.4rem;text-align:right;" id="rw-weft-count-label">8</span>
        </div>
      </div>

      <div class="rw-close-row">
        <button class="rw-close-btn" id="rw-close-btn" type="button">Esci / Chiudi</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ── DOM refs ── */
    const canvas = document.getElementById('rw-canvas');
    const warpColor = document.getElementById('rw-warp-color');
    const weftColor = document.getElementById('rw-weft-color');
    const speedSlider = document.getElementById('rw-speed');
    const warpCountSlider = document.getElementById('rw-warp-count');
    const weftCountSlider = document.getElementById('rw-weft-count');
    const warpCountLabel = document.getElementById('rw-warp-count-label');
    const weftCountLabel = document.getElementById('rw-weft-count-label');
    const patternBtns = document.querySelectorAll('[data-pattern]');
    const closeBtn = document.getElementById('rw-close-btn');

    const warpCountEl = warpCountSlider;
    const weftCountEl = weftCountSlider;

    /* ── State ── */
    const state = {
      warpColor: '#b85a3a',
      weftColor: '#e8cf8f',
      pattern: 'plain',
      speed: 0.8,
      warpCount: 8,
      weftCount: 8,
      warpPositions: [],
      weftPositions: [],
      frame: 0,
    };

    /* ── Renderer / Scene / Camera ── */
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    const DPR_CAP = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(DPR_CAP);
    const w = canvas.clientWidth || 800;
    const h = canvas.clientHeight || 520;
    renderer.setSize(w, h, false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d0c);
    scene.fog = new THREE.Fog(0x0b0d0c, 40, 120);

    const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 160);
    camera.position.set(0, 7, 16);
    camera.lookAt(0, 0, 0);

    // Controls (orbit)
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.target.set(0, 0, 0);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.08;
    orbitControls.minDistance = 4;
    orbitControls.maxDistance = 40;
    orbitControls.autoRotate = false;
    orbitControls.autoRotateSpeed = 0.6;

    // Lights
    const hemi = new THREE.HemisphereLight(0xd8e6ff, 0x1a241c, 1.4);
    const sun = new THREE.DirectionalLight(0xffe2a8, 1.8);
    sun.position.set(16, 24, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(hemi, sun);

    // Ambient fill
    const amb = new THREE.AmbientLight(0x404060, 0.3);
    scene.add(amb);

    /* ── Fabric builder ── */
    function buildFabric() {
      const group = new THREE.Group();

      // Ground contact plane (optional visual)
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x060807, roughness: 0.98, metalness: 0 });
      const floorGeo = new THREE.PlaneGeometry(16, 16);
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, -0.03, 0);
      floor.receiveShadow = true;
      group.add(floor);

      // Border frame
      const frameMat = new THREE.LineBasicMaterial({ color: 0xc7a45b });
      const frameGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(8, 0.08, 8));
      const frame = new THREE.LineSegments(frameGeo, frameMat);
      frame.position.set(0, 0, 0);
      group.add(frame);

      const warpMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.warpColor),
        roughness: 0.6, metalness: 0.05,
      });
      const weftMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.weftColor),
        roughness: 0.6, metalness: 0.05,
      });

      const warpGeo = new THREE.CylinderGeometry(0.045, 0.045, 6, 6);
      const weftGeo = new THREE.CylinderGeometry(0.04, 0.04, 6, 6);

      // Warp threads (vertical)
      const warpCount = state.warpCount;
      for (let i = 0; i < warpCount; i++) {
        const z = -3 + (i / (warpCount - 1)) * 6;
        const m = new THREE.Mesh(warpGeo, warpMat.clone());
        m.position.set(-3, 0, z);
        m.castShadow = true;
        group.add(m);
        state.warpPositions.push({ mesh: m, z });
      }

      // Weft threads (horizontal, with 3D weave structure)
      const weftCount = state.weftCount;
      for (let i = 0; i < weftCount; i++) {
        const x = -3 + (i / (weftCount - 1)) * 6;
        const m = new THREE.Mesh(weftGeo, weftMat.clone());
        m.position.set(x, 0, 0);
        m.castShadow = true;
        group.add(m);
        state.weftPositions.push({ mesh: m, x });
      }

      return group;
    }

    const fabricGroup = buildFabric();
    scene.add(fabricGroup);

    /* ── Pattern engine ── */
    function getWeftY(i, total, t, speed, pattern) {
      const base = Math.sin(t * speed * 1.3) * 0.45;
      const phase = (i / total) * Math.PI * 2;
      if (pattern === 'plain') {
        // Alternating up/down: subtle 3D offset
        const offset = pattern === 'plain' ? Math.sin(t * speed * 0.6 + phase) * 0.08 : 0;
        return base + offset;
      } else if (pattern === 'twill') {
        // Diagonal interlacing: wefts shift progressively
        const twillShift = 0.18 * Math.sin(t * speed * 0.5 + phase + 1.1);
        return base * 0.6 + twillShift;
      } else if (pattern === 'satin') {
        // Floating wefts: higher wave, less frequent
        return base * 1.15 + Math.sin(t * speed * 0.4 + phase + 2.3) * 0.12;
      }
      return base;
    }

    /* ── Animation loop ── */
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // Update weft positions
      const speed = state.speed;
      const pattern = state.pattern;
      const warpCount = state.warpCount;
      const weftCount = state.weftCount;
      const weaveHeight = 0.6;

      // Update warp colors
      fabricGroup.children.forEach(child => {
        if (child.isMesh && child.geometry.type === 'CylinderGeometry') {
          // Skip weft (horizontal, y=0) — weft is in weftPositions
          if (child.position.y !== 0) {
            child.material.color.set(state.warpColor);
          }
        }
      });

      // Recalculate weft positions (the canvas draws from state.weftPositions)
      // We need to re-find them and update Y
      let weftMeshIdx = 0;
      fabricGroup.children.forEach(child => {
        if (child.isMesh && child.geometry.type === 'CylinderGeometry' && child.position.y === 0) {
          // Horizontal weft thread
          if (weftMeshIdx >= state.weftPositions.length) return;
          const wp = state.weftPositions[weftMeshIdx];
          const y = getWeftY(weftMeshIdx, weftCount, t, speed, pattern);
          wp.mesh.position.y = y;
          weftMeshIdx++;
        }
      });

      orbitControls.update();
      renderer.render(scene, camera);
    }

    /* ── Resize ── */
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = DPR_CAP;
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize);
    // Initial size
    requestAnimationFrame(animate);

    /* ── Controls wiring ── */
    warpColor.addEventListener('input', () => {
      state.warpColor = warpColor.value;
    });

    weftColor.addEventListener('input', () => {
      state.weftColor = weftColor.value;
    });

    speedSlider.addEventListener('input', () => {
      state.speed = parseFloat(speedSlider.value);
    });

    warpCountSlider.addEventListener('input', () => {
      state.warpCount = parseInt(warpCountSlider.value, 10);
      warpCountLabel.textContent = state.warpCount;
      rebuildFabric();
    });

    weftCountSlider.addEventListener('input', () => {
      state.weftCount = parseInt(weftCountSlider.value, 10);
      weftCountLabel.textContent = state.weftCount;
      rebuildFabric();
    });

    patternBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        patternBtns.forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        state.pattern = btn.dataset.pattern;
      });
    });

    function rebuildFabric() {
      // Remove old fabric group
      fabricGroup.parent.remove(fabricGroup);
      // Re-build with new counts
      const newFabric = buildFabric();
      fabricGroup.parent.add(newFabric);
      // Store reference
      fabricGroup = newFabric;
      // Recalculate weft positions (they're recreated, need to re-clear)
      state.weftPositions = [];
      // Re-add weft positions
      const weftCount = state.weftCount;
      const weftMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.weftColor),
        roughness: 0.6, metalness: 0.05,
      });
      const weftGeo = new THREE.CylinderGeometry(0.04, 0.04, 6, 6);
      for (let i = 0; i < weftCount; i++) {
        const x = -3 + (i / (weftCount - 1)) * 6;
        const m = new THREE.Mesh(weftGeo, weftMat.clone());
        m.position.set(x, 0, 0);
        m.castShadow = true;
        fabricGroup.add(m);
        state.weftPositions.push({ mesh: m, x });
      }
      state.warpPositions = [];
      const warpMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(state.warpColor),
        roughness: 0.6, metalness: 0.05,
      });
      const warpGeo = new THREE.CylinderGeometry(0.045, 0.045, 6, 6);
      for (let i = 0; i < state.warpCount; i++) {
        const z = -3 + (i / (state.warpCount - 1)) * 6;
        const m = new THREE.Mesh(warpGeo, warpMat.clone());
        m.position.set(-3, 0, z);
        m.castShadow = true;
        fabricGroup.add(m);
        state.warpPositions.push({ mesh: m, z });
      }
    }

    /* ── Close button (from iframe overlay) ── */
    closeBtn.addEventListener('click', () => {
      window.parent.postMessage({ type: 'RW_CLOSE' }, '*');
    });

    /* ── Keyboard ── */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.parent.postMessage({ type: 'RW_CLOSE' }, '*');
      }
    });
  </script>
</body>
</html>
