<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Flop Pokè RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2340;--paper:#eef3fb;--grass:#5fae5a;--path:#c9b58a;--wall:#6b4f3a;--water:#4aa3b8;--red:#e63946;--ok:#3ecf6e;--mid:#f5c542;--low:#ef4b4b}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:10px;background:radial-gradient(900px 500px at 50% -10%,#3a58a8,#0e1430 70%);font:10px/1.6 "Press Start 2P",ui-monospace,"Courier New",monospace;color:var(--ink)}
#app{width:min(860px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 0 0 6px #e63946,0 20px 50px #000a;padding:12px}
h1{font-size:20px;text-align:center;margin:4px 0 8px;color:#e63946;text-shadow:2px 2px 0 var(--ink)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 8px;font-size:9px}
canvas{display:block;border:3px solid var(--ink);border-radius:8px;background:#8fd3ff;image-rendering:pixelated}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bar{flex:1;min-width:200px;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px}
.hp{height:8px;background:#d5dbe8;border:2px solid var(--ink);border-radius:5px;margin-top:4px;overflow:hidden}
.hp i{display:block;height:100%;width:100%;transition:width .3s,background .3s}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
button{font:inherit;font-size:9px;padding:9px 6px;border:3px solid var(--ink);border-radius:9px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:hover{background:#dbe8ff}button:active{translate:0 2px;box-shadow:0 1px 0 var(--ink)}button:focus-visible{outline:3px solid #e63946;outline-offset:2px}
.big{background:#e63946;color:#fff}.big:hover{background:#ff5561}
.ghost{background:transparent;box-shadow:none;border-style:dashed}
.off{opacity:.4;pointer-events:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:50}
.panel{width:min(720px,92vw);max-height:86vh;overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:12px;box-shadow:0 0 0 6px #e63946}
.row{display:flex;gap:10px;align-items:center;padding:6px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin-bottom:6px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px}
.ico svg{width:100%;height:100%}
.dlg{background:#1b2340;color:#fff;border-radius:10px;padding:10px;margin-top:8px;font-size:9px;min-height:54px}
.tp{display:inline-block;color:#fff;border-radius:5px;padding:0 5px;font-size:8px;margin-left:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{border:2px solid var(--ink);border-radius:8px;padding:8px;background:#fff}
@media(max-width:700px){.menu{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main id="app">
 <h1>Flip Flop Pokè — RPG</h1>
 <div class="top"><span id="loc">—</span><span id="money">💰 0</span><span id="questtop">Quest: —</span></div>
 <canvas id="cv" width="720" height="405"></canvas>
 <div class="hud">
  <div class="bar" id="partybar">Caricamento...</div>
 </div>
 <div class="menu">
  <button onclick="openMapMenu()">🗺️ Mappa</button>
  <button onclick="openTeam()">👥 Squadra</button>
  <button onclick="openInv()">🎒 Oggetti</button>
  <button onclick="openQuest()">📜 Quest</button>
  <button onclick="openSave()">💾 Salva/Carica</button>
  <button onclick="talkNPC()">💬 Parla</button>
  <button onclick="pickup()">📦 Prendi</button>
  <button onclick="settings()">⚙️ Impostazioni</button>
 </div>
 <p class="dlg" id="log">Pronto. Frecce/WASD per muoversi, Enter per interagire.</p>
</main>
<div id="ovl"></div>

const TILE=32, VW=22, VH=12;
function tileAt(m,x,y){if(!m||x<0||y<0||x>=m.w||y>=m.h)return T.WALL;return m.tiles[y][x]}
function walkable(m,x,y){const t=tileAt(m,x,y); if(!WALK.has(t)) return false; if(m.npcs.some(n=>n.x===x&&n.y===y)) return false; return true; }
function camera(){const m=map(); const px=S.player.x*TILE, py=S.player.y*TILE; let cx=px-VW*TILE/2+TILE/2, cy=py-VH*TILE/2+TILE/2; cx=Math.max(0,Math.min(m.w*TILE-VW*TILE,cx)); cy=Math.max(0,Math.min(m.h*TILE-VH*TILE,cy)); return {x:cx,y:cy}; }
const MAPCACHE={};
function buildMapCache(m){
 if(MAPCACHE[m.name]) return MAPCACHE[m.name];
 const c=document.createElement('canvas'); c.width=m.w*TILE; c.height=m.h*TILE;
 const cx=c.getContext('2d');
 for(let y=0;y<m.h;y++){
  for(let x=0;x<m.w;x++){
   const t=m.tiles[y][x];
   const X=x*TILE,Y=y*TILE;
   if(t===T.WALL){
     // pseudo-3D skyscraper block
     cx.fillStyle='#2a2f3a'; cx.fillRect(X,Y-TILE,TILE,TILE*2);
     cx.fillStyle='#1e222b'; cx.fillRect(X,Y,TILE,TILE);
     cx.fillStyle='#59647a';
     for(let yy=0;yy<TILE;yy+=6){
      for(let xx=2;xx<TILE-2;xx+=6){ cx.fillRect(X+xx,Y-TILE+yy+2,3,3); }
     }
     cx.fillStyle='#6b778f'; cx.fillRect(X,Y-TILE,TILE,3);
   } else if(t===T.PATH){
     cx.fillStyle='#3b4049'; cx.fillRect(X,Y,TILE,TILE);
     cx.fillStyle='rgba(255,255,255,.18)';
     for(let yy=6;yy<TILE;yy+=12){ cx.fillRect(X+TILE/2-1,Y+yy,2,4); }
   } else if(t===T.GROUND){
     cx.fillStyle='#cbd2db'; cx.fillRect(X,Y,TILE,TILE);
     cx.strokeStyle='rgba(80,90,110,.25)'; cx.lineWidth=1; cx.strokeRect(X+.5,Y+.5,TILE-1,TILE-1);
   } else if(t===T.GRASS){
     cx.fillStyle='#36833d'; cx.fillRect(X,Y,TILE,TILE);
     cx.fillStyle='#2d6a32'; for(let i=0;i<5;i++){ cx.fillRect(X+((i*7)%TILE),Y+((i*11)%TILE),2,2); }
   } else if(t===T.TREE){
     cx.fillStyle='#5f8f5a'; cx.fillRect(X,Y,TILE,TILE);
     cx.fillStyle='#2f6b35'; cx.beginPath(); cx.arc(X+TILE/2,Y+TILE/2,9,0,Math.PI*2); cx.fill();
     cx.fillStyle='#f5c542'; cx.beginPath(); cx.arc(X+TILE/2-6,Y+TILE/2-6,2,0,Math.PI*2); cx.fill();
   } else if(t===T.WATER){
     cx.fillStyle='#3f86a6'; cx.fillRect(X,Y,TILE,TILE);
   } else if(t===T.DOOR){
     cx.fillStyle='#8b6a47'; cx.fillRect(X,Y,TILE,TILE);
     cx.fillStyle='#f5c542'; cx.fillRect(X+TILE/2-3,Y+4,6,8);
   } else if(t===T.SIGN){
     cx.fillStyle='#cbd2db'; cx.fillRect(X,Y,TILE,TILE);
     cx.fillStyle='#d9a800'; cx.fillRect(X+TILE/2-6,Y+4,12,10);
   } else if(t===T.ITEM){
     cx.fillStyle='#cbd2db'; cx.fillRect(X,Y,TILE,TILE);
     cx.fillStyle='#ef4b4b'; cx.beginPath(); cx.arc(X+TILE/2,Y+TILE/2,6,0,Math.PI*2); cx.fill();
   } else {
     cx.fillStyle='#1a1d25'; cx.fillRect(X,Y,TILE,TILE);
   }
  }
 }
 MAPCACHE[m.name]=c; return c;
}
function scheduleYield(){ try { if(typeof scheduler!=='undefined' && scheduler.yield) scheduler.yield(); } catch(e){} }
function drawMap(){

 const cache=buildMapCache(m);
 ctx.clearRect(0,0,cv.width,cv.height);
 ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,cv.width,cv.height);
 ctx.save(); ctx.beginPath(); ctx.rect(0,0,cv.width,cv.height); ctx.clip();
 ctx.drawImage(cache, -cam.x, -cam.y);
 ctx.restore();
 const ents=[];
 (m.npcs||[]).forEach(n=>ents.push({type:'npc',x:n.x,y:n.y,color:'#dc2626',ch:n.name[0],r:12}));
 (m.signs||[]).forEach(s=>ents.push({type:'sign',x:s.x,y:s.y,color:'#d9a800',ch:'!',r:10}));
 if(m.item && !S.flags.orb) ents.push({type:'item',x:m.item.x,y:m.item.y,color:'#ef4b4b',ch:'★',r:10});
 ents.push({type:'player',x:S.player.x,y:S.player.y,color:'#2563eb',ch:'P',r:14});
 ents.sort((a,b)=>a.y-b.y);
 ents.forEach(e=>{
  const sx=e.x*TILE+TILE/2-cam.x; const sy=e.y*TILE+TILE/2-cam.y;
  if(sx<-20||sy<-20||sx>cv.width+20||sy>cv.height+20) return;
  ctx.fillStyle='rgba(0,0,0,0.24)'; ctx.beginPath(); ctx.ellipse(sx,sy+ (e.r*0.85), e.r+4, 6, 0,0,Math.PI*2); ctx.fill();
  // pseudo-3D body layers
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.arc(sx, sy-6, e.r+1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=e.color; ctx.beginPath(); ctx.arc(sx, sy-4, e.r,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#0f172a'; ctx.stroke();

  if(e.type==='player'){ ctx.strokeStyle='#93c5fd'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sy-4,e.r+3,0,Math.PI*2); ctx.stroke(); }
 });

function tryMove(dx,dy){ const p=S.player; const nx=p.x+dx, ny=p.y+dy; const m=map(); if(nx<0||ny<0||nx>=m.w||ny>=m.h)return; if(!walkable(m,nx,ny))return; p.x=nx; p.y=ny; p.dir=dx<0?3:dx>0?1:dy<0?0:2; handleTile(); }
function handleTile(){ const m=map(); const p=S.player; const t=m.tiles[p.y][p.x]; 
 // transitions
 const tr=(m.trans||[]).find(e=>e.x===p.x&&e.y===p.y); if(tr){ S.player.map=tr.to; S.player.x=tr.tx; S.player.y=tr.ty; S.log='Vai a '+MAPS[tr.to].name; save(); return;}
 // item orb
 if(m.item && p.x===m.item.x && p.y===m.item.y && !S.flags.orb){ S.flags.orb=true; S.inv.orb=(S.inv.orb||0)+1; S.log='Hai trovato Orbe Lunare!'; if(S.quests.main===1) S.quests.main=2; save(); }
 // grass encounter
 if(t===T.PATH){ if(Math.random()<0.22) startWildBattle(); }
}
function adjacentNpc(){ const p=S.player, m=map(); return m.npcs.find(n=>Math.abs(n.x-p.x)+Math.abs(n.y-p.y)===1); }

function dmg(a,d,moveId){const m=MOVES[moveId]; const acc=Math.random()*100; if(acc>m.acc)return{hit:false}; const e=TY[m.t].e[CR[d.id].t]??1; const stab=m.t===CR[a.id].t?1.5:1; const crit=Math.random()<0.08?1.5:1; const val=Math.max(1,Math.floor(((2*a.L/5+2)*m.p*a.a/d.d/50+2)*e*stab*crit*(.88+Math.random()*.14))); return{hit:true,dmg:val,eff:e,crit:crit>1};}

}
async function bAttack(move){ if(B.busy||B.won||B.lost)return; B.busy=true; bmenu(''); await playerAttackMove(move); if(B.won||B.lost){await endBattleFlow(); return;} if(B.e.hp>0 && B.p.hp>0){ await enemyAttack(); if(B.p.hp<=0){ if(S.team.some(m=>m.hp>0 && m!==B.p)){ autoSwitch(); } else { B.lost=true; } } } if(B.won||B.lost){ await endBattleFlow(); return;} B.busy=false; battleTurnMenu(); }
async function playerAttackMove(move){ bmsg(`${CR[B.p.id].n} usa ${move}!`); await sl(700); const r=dmg(B.p,B.e,move); if(!r.hit){ bmsg('Mancato!'); await sl(600); return; } B.e.hp=Math.max(0,B.e.hp-r.dmg); updBattle(); if(r.crit) await sayBattle('Brutto colpo!'); const ei=effText(r.eff); if(ei) await sayBattle(ei); if(B.e.hp<=0){ await sayBattle(`${CR[B.e.id].n} è esausto!`); await gainXP(B.p,B.rewardXP); await advanceEnemyOrWin(); } }
async function advanceEnemyOrWin(){ B.enemyIndex++; if(B.enemyIndex<B.enemyTeam.length){ B.e=B.enemyTeam[B.enemyIndex]; await sayBattle(`Entra ${CR[B.e.id].n}! (${B.enemyIndex+1}/${B.enemyTeam.length})`); } else { B.won=true; } }
async function enemyAttack(){ bmsg(`${CR[B.e.id].n} selvatico usa...`); await sl(400); const mv=B.e.moves[Math.floor(Math.random()*B.e.moves.length)]; bmsg(`${CR[B.e.id].n} usa ${mv}!`); await sl(700); const r=dmg(B.e,B.p,mv); if(!r.hit){ bmsg('Il nemico manca!'); await sl(600); return; } B.p.hp=Math.max(0,B.p.hp-r.dmg); updBattle(); if(r.crit) await sayBattle('Brutto colpo nemico!'); const ei=effText(r.eff); if(ei) await sayBattle(ei); if(B.p.hp<=0){ await sayBattle(`${CR[B.p.id].n} è esausto!`); } }
function bSwitch(){ if(B.busy)return; B.busy=true; bmenu(''); let html='<h3>Scegli compagno</h3>'; S.team.forEach((m,i)=>{ if(m.hp>0) html+=`<button onclick="doSwitch(${i})">${CR[m.id].svg} ${CR[m.id].n} Lv${m.L} ${m.hp}/${m.mh}</button>`; else html+=`<button class="off">${CR[m.id].n} esausto</button>`; }); html+='<button class="ghost" onclick="battleTurnMenu()">Indietro</button>'; openDlg2(html); B.busy=false; }
function openDlg2(html){ const w=document.createElement('div'); w.className='overlay'; w.id='xovl'; w.innerHTML='<div class="panel">'+html+'</div>'; OVL.appendChild(w); }
function closeX(){ const w=document.getElementById('xovl'); if(w) w.remove(); }
async function doSwitch(i){ closeX(); if(i===B.playerIndex)return; B.playerIndex=i; B.p=S.team[i]; bmsg(`Vai ${CR[B.p.id].n}!`); await sl(800); updBattle(); // enemy turn
 B.busy=true; await enemyAttack(); if(B.p.hp<=0){ if(S.team.some((m,ii)=>ii!==B.playerIndex && m.hp>0)){ autoSwitch(); } else B.lost=true; } if(B.won||B.lost){await endBattleFlow();return;} B.busy=false; battleTurnMenu(); }
async function bBall(){ if(B.busy)return; if(!B.canCapture){ bmsg('Non puoi catturare qui.'); return; } if((S.inv.sfera||0)<1){ bmsg('Non hai Sfere!'); return;} B.busy=true; bmenu(''); S.inv.sfera--; bmsg('Lanci una Sfera!'); await sl(1000); const e=B.e; const rate=Math.min(0.95,0.25+0.6*(1-e.hp/e.mh)); if(Math.random()<rate){ const c=Object.assign({},e,{moves:e.moves.slice(),pp:{...e.pp},status:null}); c.hp=e.hp; await sayBattle(`Preso! ${CR[e.id].n} catturato.`); if(S.team.length<6) S.team.push(c); else S.box.push(c); S.log=CR[e.id].n+' catturato.'; B.won=true; await endBattleFlow(); return; } await sayBattle(`${CR[e.id].n} si libera!`); updBattle(); await enemyAttack(); if(B.p.hp<=0){ if(S.team.some((m,ii)=>ii!==B.playerIndex && m.hp>0)) autoSwitch(); else B.lost=true;} if(B.won||B.lost){await endBattleFlow();return;} B.busy=false; battleTurnMenu(); }
async function bPot(){ if(B.busy)return; const m=B.p; if((S.inv.pozione||0)<1){ bmsg('Non hai Pozioni!'); return;} if(m.hp>=m.mh){ bmsg('PS già pieni.'); return;} B.busy=true; bmenu(''); S.inv.pozione--; m.hp=Math.min(m.mh,m.hp+35); updBattle(); await sayBattle(`${CR[m.id].n} recupera PS!`); await enemyAttack(); if(m.hp<=0){ if(S.team.some((x,ii)=>ii!==B.playerIndex && x.hp>0)) autoSwitch(); else B.lost=true;} if(B.won||B.lost){await endBattleFlow();return;} B.busy=false; battleTurnMenu(); }
async function bRun(){ if(B.busy)return; if(!B.wild){ bmsg('Non puoi fuggire da un duello!'); return;} B.busy=true; bmenu(''); if(Math.random()<0.85){ bmsg('Sei fuggito!'); await sl(700); B.won=true; B.escaped=true; await endBattleFlow(); return;} await sayBattle('Non riesci a scappare!'); await enemyAttack(); if(B.p.hp<=0){ if(S.team.some((x,ii)=>ii!==B.playerIndex && x.hp>0)) autoSwitch(); else B.lost=true;} if(B.won||B.lost){await endBattleFlow();return;} B.busy=false; battleTurnMenu(); }
async function endBattleFlow(){ closeOvl(); B.busy=true; if(B.lost){ await sl(500); S.team.forEach(m=>m.hp=Math.max(1,m.mh? m.hp:0)); // soft reset no
   S.money=Math.max(0,S.money-30); S.log='Sconfitta... perdi ₿30. Cura la squadra.'; healAll(); }
 else {
   if(B.escaped){ S.log='Fuga riuscita. Nessuna ricompensa.'; }
   else { S.money += B.rewardMoney||0; S.log=`Vittoria! +₿${B.rewardMoney||0}`; if(B.onWin) await B.onWin(); }
 }
 save(); // close battle overlay remove
 const w=document.getElementById('bwrap'); if(w) w.remove(); B=null; S.screen='map';
 if(S.quests.main===4){ await sl(500); openDlg(`<h2>Missione compiuta!</h2><p>Hai sconfitto Umbra e completato l'avventura.</p><p>Puoi continuare ad esplorare. Salva il progresso.</p><button onclick="closeOvl()">OK</button>`);}
}
async function gainXP(m,amt){ if(!amt)return; m.xp+=amt; while(m.xp>=m.L*20){ m.xp-=m.L*20; m.L++; calc(m); m.hp=Math.min(m.mh,m.hp+Math.floor(m.mh*0.2)); await sayBattle(`${CR[m.id].n} sale al livello ${m.L}!`); const sp=CR[m.id]; if(sp.evo && m.L>=sp.evo.at && m.id!==sp.evo.to){ const old=sp.n; m.id=sp.evo.to; calc(m); m.hp=Math.min(m.mh,m.hp+Math.floor(m.mh*0.25)); await sayBattle(`${old} si evolve in ${CR[m.id].n}! ✨`); await sl(900); } } }
function sl(ms){return new Promise(r=>setTimeout(r,ms));}
async function tryEvolve(m){const sp=CR[m.id]; if(sp.evo&&m.L>=sp.evo.at&&m.id!==sp.evo.to){const old=sp.n;m.id=sp.evo.to;calc(m);m.hp=Math.min(m.mh,m.hp+Math.floor(m.mh*.2));await sayBattle(`${old} si evolve in ${CR[m.id].n}!`);}}
function updatePartyBar(){ const rows=S.team.map((m,i)=>`<div class="row" style="padding:4px"><div class="ico">${CR[m.id].svg}</div><div style="flex:1"><b>${CR[m.id].n}</b> Lv${m.L}<small>${m.hp}/${m.mh} PS · ${m.status||'ok'}</small>${hbar(m)}</div></div>`).join(''); $('#partybar').innerHTML = rows + (S.team.length===0?'Squadra vuota.':''); }
function openTeam(){ let html='<h2>Squadra / Box</h2><div class="grid2"><div><h3>Attivi</h3>'+S.team.map((m,i)=>`<div class="card"><div class="ico">${CR[m.id].svg}</div><b>${CR[m.id].n}</b> Lv${m.L}<br><small>${m.hp}/${m.mh} PS · ${m.moves.join(', ')}</small><br><button style="margin-top:4px" onclick="moveToBox(${i})">→ Box</button></div>`).join('')+'</div><div><h3>Box</h3>'+(S.box.length? S.box.map((m,i)=>`<div class="card"><div class="ico">${CR[m.id].svg}</div><b>${CR[m.id].n}</b> Lv${m.L}<br><button style="margin-top:4px" onclick="moveToTeam(${i})">→ Squadra</button></div>`).join(''):'<p>Box vuoto.</p>')+'</div></div><button onclick="closeX()">Chiudi</button>'; openDlg2(html); }
function moveToBox(i){ if(S.team.length<=1){ alert('Serve almeno un compagno.'); return;} const c=S.team.splice(i,1)[0]; S.box.push(c); closeX(); openTeam(); save(); }
function moveToTeam(i){ if(S.team.length>=6){ alert('Squadra piena (max 6).'); return;} const c=S.box.splice(i,1)[0]; S.team.push(c); closeX(); openTeam(); save(); }
function openInv(){ let html='<h2>Oggetti</h2>'; for(const [k,v] of Object.entries(S.inv)){ html+=`<div class="card">${k}: <b>${v}</b></div>`; } html+='<h3>Uso veloce</h3><p>Pozioni curano 35 PS in battaglia. Sfere catturano creature selvatiche.</p><button onclick="closeX()">Chiudi</button>'; openDlg2(html); }
function openQuest(){ const names=['Parla con il sindaco','Raccogli Orbe Lunare','Sconfiggi Allenatore Marco','Sconfiggi Umbra (finale)']; let html='<h2>Quest log</h2><p>Quest corrente: <b>'+names[Math.min(S.quests.main,names.length-1)]+'</b></p><ul>'; html+='<li>Se main=0: parla al Sindaco.</li><li>Se main=1: raccogli Orbe Lunare nella Rotta Erbosa.</li><li>Se main=2: sconfiggi Marco.</li><li>Se main=3: entra in caverna e sconfiggi Umbra.</li></ul><button onclick="closeX()">Chiudi</button>'; openDlg2(html); }
function openSave(){ let html='<h2>Salva / Carica</h2>'; html+=`<button class="big" onclick="save();closeX()">💾 Salva ora</button>`; html+=`<button onclick="loadGameConfirm()">📂 Carica (ricarica)</button>`; html+=`<button class="ghost" onclick="resetGame()">↺ Nuova partita</button>`; html+=`<button onclick="exportSave()">⬇️ Esporta JSON</button>`; html+=`<button onclick="importSave()">⬆️ Importa JSON</button>`; html+='<button onclick="closeX()">Chiudi</button>'; openDlg2(html); }
function loadGameConfirm(){ if(confirm('Ricaricare l ultimo salvataggio?')){ location.reload(); } }
function resetGame(){ if(confirm('Cancellare i progressi e ricominciare?')){ localStorage.removeItem(KEY); location.reload(); } }
function exportSave(){ const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='flip-flop-rpg-save.json'; a.click(); }
function importSave(){ const i=document.createElement('input'); i.type='file'; i.accept='application/json'; i.onchange=async()=>{ const f=i.files[0]; if(!f)return; const t=await f.text(); try{const d=JSON.parse(t); if(d&&d.version===VERSION){ localStorage.setItem(KEY,JSON.stringify(d)); location.reload();} else alert('Save incompatibile.');}catch(e){alert('JSON non valido.');} }; i.click(); }
function settings(){ openDlg2('<h2>Impostazioni</h2><p>Controlli: WASD/Frecce. Invio/Spazio: interagisci. M: mappa (non attivo).</p><p>Versione '+VERSION+'</p><button onclick="closeX()">Chiudi</button>'); }
function save(){ try{ S.saveTime=new Date().toISOString(); localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ console.warn(e); } S.log='Salvataggio riuscito.'; }
function log(t){ S.log=t; const el=document.getElementById('log'); if(el) el.textContent=t; }
function openMapMenu(){ openDlg2('<h2>Mappa</h2><p>Luoghi: Borgo Iniziale, Rotta Erbosa, Caverna Ombra.</p><p>Posizione attuale: <b>'+map().name+'</b></p><button onclick="closeX()">Chiudi</button>'); }
window.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key==='Enter' || e.key===' ') talkNPC(); if(e.key==='Escape') closeX(); });
window.addEventListener('keyup',e=>{ keys[e.key]=false; });
// fix grass encounter trigger name
try { } catch(e){}
init();
</script>
</body>
