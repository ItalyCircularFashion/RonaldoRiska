<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ModaCAD Studio | Ronaldo Riska</title>
  <meta name="description" content="ModaCAD Studio: workspace CAD per modellistica digitale, cartamodelli e creazione capi di abbigliamento. Interfaccia professionale.">
  <meta name="keywords" content="Ronaldo Riska, ModaCAD, CAD, moda, cartamodelli, modellistica, pattern making">
  <meta name="theme-color" content="#0a1628">
  <link rel="alternate" hreflang="it" href="https://italycircularfashion.github.io/RonaldoRiska/modacad.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="canonical" href="https://italycircularfashion.github.io/RonaldoRiska/modacad.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a1628;
      color: #ffffff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .app-header {
      background: #0f2040;
      border-bottom: 2px solid #ff8c00;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .app-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .app-title span { color: #ff8c00; }
    .header-actions { display: flex; gap: 8px; }
    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary { background: #ff8c00; color: #0a1628; }
    .btn-primary:hover { background: #ffaa00; }
    .btn-secondary { background: #163058; color: #ffffff; border: 1px solid #2a5490; }
    .btn-secondary:hover { background: #1e4070; }

    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Panel - Pattern Library */
    .pattern-panel {
      width: 260px;
      background: #0f2040;
      border-right: 1px solid #2a5490;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .panel-header {
      padding: 12px 16px;
      background: #163058;
      border-bottom: 1px solid #2a5490;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #ff8c00;
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    /* Pattern Categories */
    .pattern-category {
      margin-bottom: 16px;
    }
    .category-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8899aa;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .pattern-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .pattern-btn {
      padding: 10px 6px;
      background: #163058;
      border: 1px solid #2a5490;
      border-radius: 6px;
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .pattern-btn:hover { background: #1e4070; border-color: #ff8c00; }
    .pattern-btn.active { background: #ff8c00; color: #0a1628; border-color: #ff8c00; }
    .pattern-btn .icon { font-size: 20px; display: block; margin-bottom: 4px; }

    /* Options Panel */
    .options-panel {
      padding: 12px;
      border-top: 1px solid #2a5490;
      background: #0a1628;
    }
    .option-row {
      margin-bottom: 10px;
    }
    .option-label {
      font-size: 11px;
      color: #8899aa;
      margin-bottom: 4px;
      display: block;
    }
    .option-select, .option-input {
      width: 100%;
      padding: 6px 8px;
      background: #163058;
      border: 1px solid #2a5490;
      border-radius: 4px;
      color: #ffffff;
      font-size: 12px;
    }
    .option-select:focus { border-color: #ff8c00; outline: none; }

    /* Canvas Area */
    .canvas-container {
      flex: 1;
      position: relative;
      background: #163058;
      overflow: hidden;
    }
    #main-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      cursor: crosshair;
    }
    .grid-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Right Panel - Colors & Layers */
    .right-panel {
      width: 200px;
      background: #0f2040;
      border-left: 1px solid #2a5490;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* Color Palette */
    .color-section { padding: 12px; }
    .color-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #ff8c00;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .color-palette { display: flex; flex-wrap: wrap; gap: 4px; }
    .color-swatch {
      width: 28px; height: 28px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .color-swatch:hover { border-color: #ffffff; transform: scale(1.1); }
    .color-swatch.active { border-color: #ff8c00; box-shadow: 0 0 0 2px rgba(255,140,0,0.3); }

    /* Layers */
    .layers-section {
      flex: 1;
      padding: 12px;
      border-top: 1px solid #2a5490;
      overflow-y: auto;
    }
    .layer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #163058;
      border: 1px solid #2a5490;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .layer-item:hover { border-color: #ff8c00; }
    .layer-item.active { border-color: #ff8c00; background: #1e4070; }
    .layer-color {
      width: 16px; height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .layer-name { flex: 1; }
    .layer-visibility {
      cursor: pointer;
      opacity: 0.6;
    }
    .layer-visibility:hover { opacity: 1; }

    /* Info Panel */
    .info-panel {
      padding: 12px;
      border-top: 1px solid #2a5490;
      background: #0a1628;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .info-label { color: #8899aa; }
    .info-value { color: #ff8c00; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

    /* Toolbar */
    .toolbar-section { padding: 12px; border-bottom: 1px solid #2a5490; }
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .tool-btn {
      padding: 8px 4px;
      background: #163058;
      border: 1px solid #2a5490;
      border-radius: 4px;
      color: #ffffff;
      font-size: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .tool-btn:hover { background: #1e4070; border-color: #ff8c00; }
    .tool-btn.active { background: #ff8c00; color: #0a1628; border-color: #ff8c00; }
    .tool-btn .icon { font-size: 16px; display: block; }

    /* Thickness */
    .thickness-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .thick-btn {
      padding: 6px;
      background: #163058;
      border: 1px solid #2a5490;
      border-radius: 4px;
      color: #ffffff;
      font-size: 10px;
      cursor: pointer;
      text-align: center;
    }
    .thick-btn:hover { border-color: #ff8c00; }
    .thick-btn.active { background: #ff8c00; color: #0a1628; border-color: #ff8c00; }
  </style>
</head>
<body>

    <div class="app-title">ModaCAD <span>Studio</span></div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="clearCanvas()">Cancella</button>

  <div class="app-body">

      <div class="panel-header">Libreria Pattern</div>

            <button class="tool-btn" data-tool="eraser" onclick="selectTool('eraser')">

            <button class="tool-btn" data-tool="text" onclick="selectTool('text')">

            <button class="tool-btn" data-tool="measure" onclick="selectTool('measure')">

          <div class="color-swatch" style="background:#ffaa00" onclick="setColor('#ffaa00')"></div>

  <script>
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    
    // State
    let currentTool = 'pencil';
    let currentColor = '#ff8c00';
    let currentWidth = 2;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let strokes = 0;
    let undoStack = [];
    let currentPattern = null;
    let patternColor = '#ff8c00';
    let drawingColor = '#ffffff';
    let layers = {
      pattern: { visible: true, color: '#ff8c00' },
      drawing: { visible: true, color: '#ffffff' }
    };

    // Resize canvas
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      redrawCanvas();
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    // Save state for undo
    function saveState() {
      if (undoStack.length > 30) undoStack.shift();
      undoStack.push(canvas.toDataURL());
    }

    // Tool selection
    function selectTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === tool);
      });
      const names = {
        pencil: 'Matita', line: 'Linea', rect: 'Rettangolo', circle: 'Cerchio',
        eraser: 'Gomma', text: 'Testo', measure: 'Misura', select: 'Seleziona'
      };
      document.getElementById('info-tool').textContent = names[tool] || tool;
    }

    // Width selection
    function setWidth(width) {
      currentWidth = width;
      document.querySelectorAll('.thick-btn[data-width]').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.width) === width);
      });
      document.getElementById('info-width').textContent = width + 'px';
    }

    // Color selection
    function setColor(color) {
      currentColor = color;
      document.querySelectorAll('.color-swatch').forEach(s => {
        s.classList.remove('active');
      });
      // Find and activate matching swatch
      document.querySelectorAll('.color-swatch').forEach(s => {
        const bg = s.style.background;
        if (bg === color || bg === color.toUpperCase()) {
          s.classList.add('active');
        }
      });
      document.getElementById('info-color').textContent = color;
    }

    // Canvas events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Touch support
    canvas.addEventListener('touchstart', handleTouch);
    canvas.addEventListener('touchmove', handleTouchMove);
    canvas.addEventListener('touchend', stopDrawing);

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const coords = getCoords(e);
      startX = coords.x;
      startY = coords.y;
      saveState();

      if (currentTool === 'pencil' || currentTool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      } else if (currentTool === 'text') {
        const text = prompt('Inserisci testo:');
        if (text) {
          ctx.font = `${currentWidth * 4}px Inter, sans-serif`;
          ctx.fillStyle = currentTool === 'eraser' ? '#163058' : currentColor;
          ctx.fillText(text, startX, startY);
        }
        isDrawing = false;
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      const coords = getCoords(e);

      ctx.strokeStyle = currentTool === 'eraser' ? '#163058' : currentColor;
      ctx.lineWidth = currentWidth;

      if (currentTool === 'pencil' || currentTool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(coords.x, coords.y);
        ctx.stroke();
        startX = coords.x;
        startY = coords.y;
      } else if (currentTool === 'line') {
        redrawCanvas();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(coords.x, coords.y);
        ctx.stroke();
      } else if (currentTool === 'rect') {
        redrawCanvas();
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentWidth;
        ctx.strokeRect(startX, startY, coords.x - startX, coords.y - startY);
      } else if (currentTool === 'circle') {
        redrawCanvas();
        ctx.beginPath();
        const rx = Math.abs(coords.x - startX) / 2;
        const ry = Math.abs(coords.y - startY) / 2;
        const cx = startX + (coords.x - startX) / 2;
        const cy = startY + (coords.y - startY) / 2;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (currentTool === 'measure') {
        redrawCanvas();
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(coords.x, coords.y);
        ctx.stroke();
        ctx.setLineDash([]);
        const dist = Math.sqrt(Math.pow(coords.x - startX, 2) + Math.pow(coords.y - startY, 2));
        ctx.font = '12px JetBrains Mono, monospace';
        ctx.fillStyle = '#ff8c00';
        ctx.fillText(`${(dist / 20).toFixed(1)}cm`, (startX + coords.x) / 2, (startY + coords.y) / 2 - 10);
      }
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;
      strokes++;
      document.getElementById('info-strokes').textContent = strokes;
    }

    function handleTouch(e) {
      e.preventDefault();
      const touch = e.touches[0];
      startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
    }

    function handleTouchMove(e) {
      e.preventDefault();
      const touch = e.touches[0];
      draw({ clientX: touch.clientX, clientY: touch.clientY });
    }

    function redrawCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;
      ctx.fillStyle = '#163058';
      ctx.fillRect(0, 0, w, h);
      if (currentPattern && layers.pattern.visible) {
        drawPattern(currentPattern);
      }
    }

    function clearCanvas() {
      saveState();
      currentPattern = null;
      document.getElementById('info-pattern').textContent = 'Nessuno';
      redrawCanvas();
      strokes = 0;
      document.getElementById('info-strokes').textContent = '0';
    }

    function undoLast() {
      if (undoStack.length === 0) return;
      const img = new Image();
      img.onload = () => {
        const dpr = window.devicePixelRatio || 1;
        ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
        ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);
      };
      img.src = undoStack.pop();
    }

    function exportPNG() {
      const link = document.createElement('a');
      link.download = 'modacad-pattern.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function salvaProgetto() {
      const dataUrl = canvas.toDataURL();
      localStorage.setItem('modacad-project', dataUrl);
      alert('Progetto salvato!');
    }

    // Pattern drawing
    function drawPattern(type) {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width / dpr;
      const h = canvas.height / dpr;
      const cx = w / 2;
      const cy = h / 2;
      
      ctx.strokeStyle = patternColor;
      ctx.lineWidth = 2;
      ctx.fillStyle = 'rgba(255,140,0,0.05)';

      const collarType = document.getElementById('opt-collar')?.value || 'crew';
      const sleeveType = document.getElementById('opt-sleeve')?.value || 'short';
      const lengthType = document.getElementById('opt-length')?.value || 'standard';
      const fitType = document.getElementById('opt-fit')?.value || 'regular';

      if (type === 'front') {
        // Front bodice with options
        const fitOffset = fitType === 'slim' ? 10 : fitType === 'relaxed' ? -10 : 0;
        const lengthMult = lengthType === 'lungo' ? 1.3 : lengthType === 'corto' ? 0.7 : 1;
        
        ctx.beginPath();
        ctx.moveTo(cx - 60 + fitOffset, cy - 100);
        ctx.lineTo(cx + 60 - fitOffset, cy - 100);
        ctx.lineTo(cx + 80 - fitOffset, cy);
        ctx.lineTo(cx + 70 - fitOffset, cy + 120 * lengthMult);
        ctx.lineTo(cx - 70 + fitOffset, cy + 120 * lengthMult);
        ctx.lineTo(cx - 80 + fitOffset, cy);
        ctx.closePath();
        ctx.stroke();
        ctx.fill();

        // Collar
        ctx.beginPath();
        if (collarType === 'crew') {
          ctx.arc(cx, cy - 100, 30, 0, Math.PI, false);
        } else if (collarType === 'v-neck') {
          ctx.moveTo(cx - 30, cy - 100);
          ctx.lineTo(cx, cy - 60);
          ctx.lineTo(cx + 30, cy - 100);
        } else if (collarType === 'polo') {
          ctx.moveTo(cx - 25, cy - 100);
          ctx.lineTo(cx - 15, cy - 80);
          ctx.lineTo(cx, cy - 90);
          ctx.lineTo(cx + 15, cy - 80);
          ctx.lineTo(cx + 25, cy - 100);
        } else if (collarType === 'button-down') {
          ctx.moveTo(cx - 30, cy - 100);
          ctx.lineTo(cx - 20, cy - 70);
          ctx.lineTo(cx, cy - 80);
          ctx.lineTo(cx + 20, cy - 70);
          ctx.lineTo(cx + 30, cy - 100);
          ctx.stroke();
          // Buttons
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy - 90 + i * 15, 3, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else if (collarType === 'mandarin') {
          ctx.rect(cx - 20, cy - 110, 40, 15);
        }
        ctx.stroke();

        // Sleeves
        if (sleeveType !== 'sleeveless') {
          const sleeveLen = sleeveType === 'short' ? 40 : sleeveType === '3/4' ? 80 : 120;
          // Left sleeve
          ctx.beginPath();
          ctx.moveTo(cx - 80 + fitOffset, cy);
          ctx.lineTo(cx - 100 + fitOffset, cy + sleeveLen);
          ctx.lineTo(cx - 70 + fitOffset, cy + sleeveLen - 10);
          ctx.lineTo(cx - 60 + fitOffset, cy + 10);
          ctx.stroke();
          // Right sleeve
          ctx.beginPath();
          ctx.moveTo(cx + 80 - fitOffset, cy);
          ctx.lineTo(cx + 100 - fitOffset, cy + sleeveLen);
          ctx.lineTo(cx + 70 - fitOffset, cy + sleeveLen - 10);
          ctx.lineTo(cx + 60 - fitOffset, cy + 10);
          ctx.stroke();
        }

      } else if (type === 'back') {
        const fitOffset = fitType === 'slim' ? 10 : fitType === 'relaxed' ? -10 : 0;
        const lengthMult = lengthType === 'lungo' ? 1.3 : lengthType === 'corto' ? 0.7 : 1;
        
        ctx.beginPath();
        ctx.moveTo(cx - 60 + fitOffset, cy - 100);
        ctx.lineTo(cx + 60 - fitOffset, cy - 100);
        ctx.lineTo(cx + 80 - fitOffset, cy);
        ctx.lineTo(cx + 70 - fitOffset, cy + 120 * lengthMult);
        ctx.lineTo(cx - 70 + fitOffset, cy + 120 * lengthMult);
        ctx.lineTo(cx - 80 + fitOffset, cy);
        ctx.closePath();
        ctx.stroke();
        ctx.fill();

        // Yoke
        ctx.beginPath();
        ctx.moveTo(cx - 50, cy - 80);
        ctx.quadraticCurveTo(cx, cy - 90, cx + 50, cy - 80);
        ctx.stroke();

      } else if (type === 'sleeve') {
        const sleeveLen = sleeveType === 'short' ? 80 : sleeveType === '3/4' ? 140 : 200;
        ctx.beginPath();
        ctx.moveTo(cx - 60, cy - 40);
        ctx.quadraticCurveTo(cx, cy - 60, cx + 60, cy - 40);
        ctx.lineTo(cx + 50, cy + sleeveLen);
        ctx.lineTo(cx - 50, cy + sleeveLen);
        ctx.closePath();
        ctx.stroke();
        ctx.fill();
        // Cuff
        ctx.beginPath();
        ctx.moveTo(cx - 50, cy + sleeveLen);
        ctx.lineTo(cx + 50, cy + sleeveLen);
        ctx.stroke();

      } else if (type === 'collar') {
        if (collarType === 'crew') {
          ctx.beginPath();
          ctx.ellipse(cx, cy, 50, 30, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.ellipse(cx, cy, 35, 20, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (collarType === 'polo') {
          ctx.beginPath();
          ctx.moveTo(cx - 40, cy - 20);
          ctx.lineTo(cx - 30, cy + 20);
          ctx.lineTo(cx - 15, cy + 10);
          ctx.lineTo(cx, cy + 20);
          ctx.lineTo(cx + 15, cy + 10);
          ctx.lineTo(cx + 30, cy + 20);
          ctx.lineTo(cx + 40, cy - 20);
          ctx.stroke();
        } else if (collarType === 'button-down') {
          ctx.beginPath();
          ctx.moveTo(cx - 40, cy - 20);
          ctx.lineTo(cx - 30, cy + 30);
          ctx.lineTo(cx + 30, cy + 30);
          ctx.lineTo(cx + 40, cy - 20);
          ctx.stroke();
          // Buttons
          for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.arc(cx, cy - 10 + i * 12, 4, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else {
          ctx.beginPath();
          ctx.ellipse(cx, cy, 50, 25, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

      } else if (type === 'cuff') {
        ctx.beginPath();
        ctx.rect(cx - 40, cy - 20, 80, 40);
        ctx.stroke();
        ctx.beginPath();
        ctx.rect(cx - 35, cy - 15, 70, 30);
        ctx.stroke();
        // Button
        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.stroke();

      } else if (type === 'pocket') {
        ctx.beginPath();
        ctx.rect(cx - 30, cy - 20, 60, 50);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - 30, cy - 20);
        ctx.lineTo(cx + 30, cy - 20);
        ctx.stroke();
        // Pocket flap
        ctx.beginPath();
        ctx.moveTo(cx - 25, cy - 15);
        ctx.lineTo(cx + 25, cy - 15);
        ctx.stroke();

      } else if (type === 'hem') {
        ctx.beginPath();
        ctx.moveTo(cx - 80, cy);
        for (let i = 0; i < 16; i++) {
          const x = cx - 80 + i * 10;
          const y = cy + (i % 2 === 0 ? 0 : 8);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(cx + 80, cy);
        ctx.stroke();

      } else if (type === 'yoke') {
        ctx.beginPath();
        ctx.moveTo(cx - 60, cy - 30);
        ctx.quadraticCurveTo(cx, cy - 50, cx + 60, cy - 30);
        ctx.quadraticCurveTo(cx, cy + 10, cx - 60, cy - 30);
        ctx.stroke();
      }
    }

    function loadPattern(type) {
      saveState();
      currentPattern = type;
      redrawCanvas();
      const names = {
        front: 'Fronte', back: 'Retro', sleeve: 'Manica', collar: 'Collo',
        cuff: 'Polsino', pocket: 'Tasca', hem: 'Orlo', yoke: 'Spalla'
      };
      document.getElementById('info-pattern').textContent = names[type] || type;
    }

    function loadGarment(type) {
      saveState();
      currentPattern = type;
      redrawCanvas();
      const names = {
        tshirt: 'T-Shirt', shirt: 'Camicia', jacket: 'Giacca',
        pants: 'Pantaloni', skirt: 'Gonna', dress: 'Vestito'
      };
      document.getElementById('info-pattern').textContent = names[type] || type;
    }

    function updatePatternOptions() {
      if (currentPattern === 'front' || currentPattern === 'back') {
        redrawCanvas();
      }
    }

    // Initialize
    redrawCanvas();
  </script>

</body>
